<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>電聯次數統計儀表板</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Chart.js CDN -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body class="bg-slate-50 text-slate-800 font-sans min-h-screen p-4 md:p-8">
    <div class="max-w-7xl mx-auto space-y-6">
        
        <!-- 頂部標題與控制列 -->
        <header class="bg-white p-6 rounded-2xl shadow-sm border border-slate-200 flex flex-col md:flex-row justify-between items-start md:items-center gap-4">
            <div>
                <h1 class="text-2xl font-bold text-slate-900 tracking-tight">📞 電聯次數統計儀表板</h1>
                <p class="text-sm text-slate-500 mt-1">依試算表 P 欄位紀錄者統計（2026/01/01 以來人員之每月電聯數據）</p>
            </div>
            <div class="flex items-center gap-3">
                <span id="update-time" class="text-xs text-slate-400">載入中...</span>
                <button id="refresh-btn" onclick="fetchData()" class="px-4 py-2 bg-blue-600 hover:bg-blue-700 text-white text-sm font-medium rounded-lg transition shadow">
                    🔄 重新載入數據
                </button>
            </div>
        </header>

        <!-- 日期範圍篩選列 -->
        <section class="bg-white p-5 rounded-2xl border border-slate-200 shadow-sm flex flex-wrap items-center justify-between gap-4">
            <div class="flex flex-wrap items-center gap-3 text-sm">
                <span class="font-semibold text-slate-700 flex items-center gap-1">📅 日期範圍篩選：</span>
                <div class="flex items-center gap-2">
                    <input type="date" id="start-date" class="px-3 py-1.5 border border-slate-300 rounded-lg text-sm focus:ring-2 focus:ring-blue-500 focus:outline-none bg-slate-50">
                    <span class="text-slate-400">至</span>
                    <input type="date" id="end-date" class="px-3 py-1.5 border border-slate-300 rounded-lg text-sm focus:ring-2 focus:ring-blue-500 focus:outline-none bg-slate-50">
                </div>
                <button onclick="applyDateFilter()" class="px-3.5 py-1.5 bg-slate-800 hover:bg-slate-900 text-white text-sm font-medium rounded-lg transition">
                    套用篩選
                </button>
                <button onclick="resetDateFilter()" class="px-3.5 py-1.5 bg-slate-100 hover:bg-slate-200 text-slate-600 text-sm font-medium rounded-lg transition">
                    全部清除
                </button>
            </div>
            <!-- 快捷按鈕 -->
            <div class="flex items-center gap-2 text-xs">
                <span class="text-slate-400">快速切換：</span>
                <button onclick="setQuickRange('2026-all')" class="px-2.5 py-1 bg-blue-50 hover:bg-blue-100 text-blue-700 font-medium rounded border border-blue-200 transition">2026 年至今</button>
                <button onclick="setQuickRange('this-month')" class="px-2.5 py-1 bg-slate-100 hover:bg-slate-200 text-slate-700 font-medium rounded transition">本月</button>
                <button onclick="setQuickRange('last-30')" class="px-2.5 py-1 bg-slate-100 hover:bg-slate-200 text-slate-700 font-medium rounded transition">近 30 天</button>
            </div>
        </section>

        <!-- 關鍵指標卡片 (KPI) -->
        <section class="grid grid-cols-1 sm:grid-cols-3 gap-4">
            <div class="bg-white p-5 rounded-xl border border-slate-200 shadow-sm">
                <div class="text-xs font-semibold text-slate-400 uppercase tracking-wider">篩選區間電聯總筆數</div>
                <div id="stat-total-calls" class="text-3xl font-extrabold text-blue-600 mt-2">0</div>
            </div>
            <div class="bg-white p-5 rounded-xl border border-slate-200 shadow-sm">
                <div class="text-xs font-semibold text-slate-400 uppercase tracking-wider">區間包含天數</div>
                <div id="stat-total-days" class="text-3xl font-extrabold text-emerald-600 mt-2">0</div>
            </div>
            <div class="bg-white p-5 rounded-xl border border-slate-200 shadow-sm">
                <div class="text-xs font-semibold text-slate-400 uppercase tracking-wider">2026 活躍紀錄者數 (P欄)</div>
                <div id="stat-total-recorders" class="text-3xl font-extrabold text-indigo-600 mt-2">0</div>
            </div>
        </section>

        <!-- 每月電聯次數統計表 (僅列 2026/01/01 以來出現過的 P 欄紀錄者) -->
        <section class="bg-white rounded-2xl border border-slate-200 shadow-sm overflow-hidden">
            <div class="p-5 border-b border-slate-100 flex flex-col sm:flex-row justify-between sm:items-center gap-2 bg-slate-50/50">
                <div>
                    <h2 class="text-base font-semibold text-slate-900">📊 紀錄者 (P欄) × 每月電聯次數統計表</h2>
                    <p class="text-xs text-slate-500 mt-0.5">統計 2026/01/01 以後有紀錄的人員在各月份的分佈</p>
                </div>
            </div>
            <div class="overflow-x-auto">
                <table class="min-w-full divide-y divide-slate-200 text-sm text-left">
                    <thead id="month-table-head" class="bg-slate-100/75 text-slate-700 font-semibold"></thead>
                    <tbody id="month-table-body" class="divide-y divide-slate-100 bg-white">
                        <tr>
                            <td colspan="100%" class="text-center py-8 text-slate-400">數據載入中...</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </section>

        <!-- 圖表分析區 -->
        <section class="grid grid-cols-1 lg:grid-cols-2 gap-6">
            <!-- 趨勢圖 -->
            <div class="bg-white p-6 rounded-2xl border border-slate-200 shadow-sm">
                <h2 class="text-base font-semibold text-slate-800 mb-4">📈 篩選區間：每日電聯總量趨勢</h2>
                <div class="h-64">
                    <canvas id="trendChart"></canvas>
                </div>
            </div>
            <!-- 每位紀錄者排行 -->
            <div class="bg-white p-6 rounded-2xl border border-slate-200 shadow-sm">
                <h2 class="text-base font-semibold text-slate-800 mb-4">🏆 各紀錄者電聯次數累計</h2>
                <div class="h-64">
                    <canvas id="recorderChart"></canvas>
                </div>
            </div>
        </section>

        <!-- 每日明細交叉統計報表 -->
        <section class="bg-white rounded-2xl border border-slate-200 shadow-sm overflow-hidden">
            <div class="p-5 border-b border-slate-100 flex justify-between items-center bg-slate-50/50">
                <h2 class="text-base font-semibold text-slate-800">📋 篩選區間：每日 × 紀錄者交叉明細表</h2>
            </div>
            <div class="overflow-x-auto max-h-[500px]">
                <table class="min-w-full divide-y divide-slate-200 text-sm text-left">
                    <thead id="table-head" class="bg-slate-100/90 text-slate-700 font-semibold sticky top-0 shadow-sm"></thead>
                    <tbody id="table-body" class="divide-y divide-slate-100 bg-white">
                        <tr>
                            <td colspan="100%" class="text-center py-8 text-slate-400">數據載入中...</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </section>
    </div>

    <script>
        const SHEET_ID = "2PACX-1vT89XIeyzq77eYwwxxzJsOP8K7i6xRkWsa3vdPzIk8KEJsWZJWN9-FqrG8oKQW2nzJFrlaukXjAPawb";
        const GID = "1858143220";

        let rawParsedData = []; 
        let active2026Recorders = new Set(); 
        let trendChartInstance = null;
        let recorderChartInstance = null;

        window.addEventListener('DOMContentLoaded', () => {
            fetchData();
        });

        function fetchData() {
            const btn = document.getElementById('refresh-btn');
            btn.disabled = true;
            btn.innerText = "⏳ 載入中...";

            const url = `https://docs.google.com/spreadsheets/d/e/${SHEET_ID}/pub?gid=${GID}&single=true&output=csv&t=${Date.now()}`;
            const proxyUrl = `https://api.allorigins.win/raw?url=${encodeURIComponent(url)}`;

            fetch(proxyUrl)
                .then(res => {
                    if (!res.ok) throw new Error("HTTP " + res.status);
                    return res.text();
                })
                .then(csvText => handleCSV(csvText))
                .catch(err => {
                    console.warn("代理讀取失敗，嘗試直接讀取:", err);
                    fetch(url)
                        .then(r => r.text())
                        .then(csvText => handleCSV(csvText))
                        .catch(e => {
                            btn.disabled = false;
                            btn.innerText = "⚠️ 載入失敗，點擊重試";
                            alert("資料讀取失敗，請確認網路連線是否正常。");
                        });
                });
        }

        function handleCSV(csvText) {
            const btn = document.getElementById('refresh-btn');
            btn.disabled = false;
            btn.innerText = "🔄 重新載入數據";
            document.getElementById('update-time').innerText = "最後更新: " + new Date().toLocaleTimeString('zh-TW');

            parseCSV(csvText);
        }

        function parseCSV(text) {
            const lines = text.trim().split(/\r?\n/).map(l => {
                const row = [];
                let inQuotes = false, token = '';
                for (let i = 0; i < l.length; i++) {
                    const c = l[i];
                    if (c === '"') inQuotes = !inQuotes;
                    else if (c === ',' && !inQuotes) {
                        row.push(token.trim().replace(/^"|"$/g, ''));
                        token = '';
                    } else token += c;
                }
                row.push(token.trim().replace(/^"|"$/g, ''));
                return row;
            });

            if (lines.length < 2) return;

            const headers = lines[0];
            const rows = lines.slice(1);

            // 自動偵測日期欄位
            const dateKeywords = ['日期', '電聯日期', '通話日期', '時間', 'date', 'created_at', '時間戳記'];
            let dateIdx = headers.findIndex(h => dateKeywords.some(k => h.toLowerCase().includes(k)));
            if (dateIdx === -1) dateIdx = 0;

            // 固定鎖定 P 欄位（第 16 欄，索引為 15）
            const userIdx = 15;

            rawParsedData = [];
            active2026Recorders.clear();

            rows.forEach(r => {
                const rawDate = r[dateIdx];
                const rawUser = (r[userIdx] !== undefined) ? r[userIdx].trim() : '';

                // 過濾掉空值或無效人員名稱
                if (!rawDate || !rawUser || rawUser === '' || rawUser === '-') return;

                const date = normalizeDate(rawDate);
                if (!date || date === '未註記日期') return;

                const month = date.substring(0, 7); // YYYY-MM
                rawParsedData.push({ date, month, user: rawUser });

                // 篩選 2026/01/01 以後有紀錄之 P 欄人員
                if (date >= '2026-01-01') {
                    active2026Recorders.add(rawUser);
                }
            });

            // 渲染 P 欄人員每月電聯統計表
            renderMonthlyMatrix();

            // 預設篩選區間為 2026 年初至今
            setQuickRange('2026-all', false);

            // 計算篩選圖表與明細表
            applyDateFilter();
        }

        function normalizeDate(rawDate) {
            if (!rawDate) return null;
            const str = rawDate.trim().split(' ')[0].replace(/\//g, '-');
            const parts = str.split('-');
            if (parts.length === 3) {
                return `${parts[0]}-${parts[1].padStart(2, '0')}-${parts[2].padStart(2, '0')}`;
            }
            return str;
        }

        // 渲染每月電聯次數統計表 (僅限 2026 活躍之 P 欄紀錄者)
        function renderMonthlyMatrix() {
            const head = document.getElementById('month-table-head');
            const body = document.getElementById('month-table-body');

            const recorders = Array.from(active2026Recorders).sort();

            if (recorders.length === 0) {
                head.innerHTML = '';
                body.innerHTML = '<tr><td class="text-center py-6 text-slate-400">2026/01/01 以後無符合之紀錄者數據</td></tr>';
                return;
            }

            // 取得所有月份
            const allMonths = Array.from(new Set(rawParsedData.map(d => d.month))).sort();

            const userMonthMatrix = {};
            const monthTotals = {};
            const userGrandTotals = {};
            let grandTotal = 0;

            recorders.forEach(u => {
                userMonthMatrix[u] = {};
                userGrandTotals[u] = 0;
            });
            allMonths.forEach(m => monthTotals[m] = 0);

            rawParsedData.forEach(item => {
                if (active2026Recorders.has(item.user)) {
                    userMonthMatrix[item.user][item.month] = (userMonthMatrix[item.user][item.month] || 0) + 1;
                    monthTotals[item.month] = (monthTotals[item.month] || 0) + 1;
                    userGrandTotals[item.user] = (userGrandTotals[item.user] || 0) + 1;
                    grandTotal++;
                }
            });

            // 建立表頭
            let headHTML = `<tr>
                <th class="py-3 px-4 text-slate-700 bg-slate-100">紀錄者姓名 (P欄)</th>`;
            allMonths.forEach(m => {
                headHTML += `<th class="py-3 px-4 text-center">${m}</th>`;
            });
            headHTML += `<th class="py-3 px-4 text-center bg-indigo-50 font-bold text-indigo-900">累計總數</th></tr>`;
            head.innerHTML = headHTML;

            // 建立內容 (依總通話量由高到低排序)
            const sortedByCalls = [...recorders].sort((a, b) => (userGrandTotals[b] || 0) - (userGrandTotals[a] || 0));

            let bodyHTML = '';
            sortedByCalls.forEach(user => {
                bodyHTML += `<tr class="hover:bg-slate-50 transition">
                    <td class="py-3 px-4 font-semibold text-slate-900 bg-white">${user}</td>`;
                allMonths.forEach(m => {
                    const count = userMonthMatrix[user][m] || 0;
                    const cellStyle = count > 0 ? 'text-slate-800 font-medium' : 'text-slate-300';
                    bodyHTML += `<td class="py-3 px-4 text-center ${cellStyle}">${count > 0 ? count : '-'}</td>`;
                });
                bodyHTML += `<td class="py-3 px-4 text-center font-bold bg-indigo-50/50 text-indigo-700">${userGrandTotals[user] || 0}</td>
                </tr>`;
            });

            // 建立加總列
            bodyHTML += `<tr class="bg-slate-100 font-bold text-slate-900 border-t-2 border-slate-300">
                <td class="py-3 px-4">全體合計</td>`;
            allMonths.forEach(m => {
                bodyHTML += `<td class="py-3 px-4 text-center text-slate-900">${monthTotals[m] || 0}</td>`;
            });
            bodyHTML += `<td class="py-3 px-4 text-center text-indigo-800 text-base font-extrabold">${grandTotal}</td></tr>`;

            body.innerHTML = bodyHTML;
        }

        // 日期篩選
        function applyDateFilter() {
            const start = document.getElementById('start-date').value;
            const end = document.getElementById('end-date').value;

            const filteredData = rawParsedData.filter(d => {
                if (!active2026Recorders.has(d.user)) return false;
                if (start && d.date < start) return false;
                if (end && d.date > end) return false;
                return true;
            });

            renderFilteredViews(filteredData);
        }

        function resetDateFilter() {
            document.getElementById('start-date').value = '';
            document.getElementById('end-date').value = '';
            const filteredData = rawParsedData.filter(d => active2026Recorders.has(d.user));
            renderFilteredViews(filteredData);
        }

        function setQuickRange(type, triggerApply = true) {
            const today = new Date();
            const formatDate = (d) => d.toISOString().split('T')[0];

            if (type === '2026-all') {
                document.getElementById('start-date').value = '2026-01-01';
                document.getElementById('end-date').value = formatDate(today);
            } else if (type === 'this-month') {
                const firstDay = new Date(today.getFullYear(), today.getMonth(), 1);
                document.getElementById('start-date').value = formatDate(firstDay);
                document.getElementById('end-date').value = formatDate(today);
            } else if (type === 'last-30') {
                const past = new Date();
                past.setDate(today.getDate() - 30);
                document.getElementById('start-date').value = formatDate(past);
                document.getElementById('end-date').value = formatDate(today);
            }

            if (triggerApply) applyDateFilter();
        }

        function renderFilteredViews(data) {
            const dateMap = {};
            const userTotals = {};
            const dateTotals = {};
            const uniqueRecorders = new Set();
            let totalCalls = data.length;

            data.forEach(item => {
                uniqueRecorders.add(item.user);
                if (!dateMap[item.date]) dateMap[item.date] = {};
                dateMap[item.date][item.user] = (dateMap[item.date][item.user] || 0) + 1;

                userTotals[item.user] = (userTotals[item.user] || 0) + 1;
                dateTotals[item.date] = (dateTotals[item.date] || 0) + 1;
            });

            const sortedDates = Object.keys(dateMap).sort();
            const recorderList = Array.from(uniqueRecorders).sort();

            // 更新 KPI
            document.getElementById('stat-total-calls').innerText = totalCalls.toLocaleString();
            document.getElementById('stat-total-days').innerText = sortedDates.length;
            document.getElementById('stat-total-recorders').innerText = active2026Recorders.size;

            // 圖表渲染
            renderCharts(sortedDates, dateTotals, recorderList, userTotals);

            // 每日交叉表渲染
            renderDailyTable(sortedDates, dateMap, recorderList, dateTotals, userTotals, totalCalls);
        }

        function renderCharts(dates, dateTotals, recorders, userTotals) {
            const trendCtx = document.getElementById('trendChart').getContext('2d');
            if (trendChartInstance) trendChartInstance.destroy();
            trendChartInstance = new Chart(trendCtx, {
                type: 'line',
                data: {
                    labels: dates,
                    datasets: [{
                        label: '每日總電聯次數',
                        data: dates.map(d => dateTotals[d] || 0),
                        borderColor: '#2563eb',
                        backgroundColor: 'rgba(37, 99, 235, 0.1)',
                        fill: true,
                        tension: 0.3,
                        borderWidth: 2,
                        pointRadius: 3,
                        pointBackgroundColor: '#2563eb'
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    scales: { y: { beginAtZero: true, ticks: { precision: 0 } } }
                }
            });

            const recorderCtx = document.getElementById('recorderChart').getContext('2d');
            if (recorderChartInstance) recorderChartInstance.destroy();

            const sortedRecorders = [...recorders].sort((a, b) => (userTotals[b] || 0) - (userTotals[a] || 0));

            recorderChartInstance = new Chart(recorderCtx, {
                type: 'bar',
                data: {
                    labels: sortedRecorders,
                    datasets: [{
                        label: '電聯次數',
                        data: sortedRecorders.map(u => userTotals[u] || 0),
                        backgroundColor: '#4f46e5',
                        borderRadius: 6
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    scales: { y: { beginAtZero: true, ticks: { precision: 0 } } },
                    plugins: { legend: { display: false } }
                }
            });
        }

        function renderDailyTable(dates, dateMap, recorders, dateTotals, userTotals, grandTotal) {
            const head = document.getElementById('table-head');
            const body = document.getElementById('table-body');

            if (dates.length === 0) {
                head.innerHTML = '';
                body.innerHTML = '<tr><td class="text-center py-8 text-slate-400">此篩選區間無電聯紀錄</td></tr>';
                return;
            }

            let headHTML = `<tr><th class="py-3 px-4 text-slate-700 bg-slate-100">日期</th>`;
            recorders.forEach(rec => {
                headHTML += `<th class="py-3 px-4 text-center bg-slate-100">${rec}</th>`;
            });
            headHTML += `<th class="py-3 px-4 text-center bg-slate-200 font-bold text-slate-900">當日合計</th></tr>`;
            head.innerHTML = headHTML;

            let bodyHTML = '';
            dates.forEach(d => {
                bodyHTML += `<tr class="hover:bg-slate-50/80 transition">
                    <td class="py-3 px-4 font-medium text-slate-900">${d}</td>`;
                recorders.forEach(rec => {
                    const count = dateMap[d][rec] || 0;
                    const cellColor = count > 0 ? 'text-slate-800 font-medium' : 'text-slate-300';
                    bodyHTML += `<td class="py-3 px-4 text-center ${cellColor}">${count > 0 ? count : '-'}</td>`;
                });
                bodyHTML += `<td class="py-3 px-4 text-center font-bold bg-slate-50 text-blue-600">${dateTotals[d] || 0}</td>
                </tr>`;
            });

            bodyHTML += `<tr class="bg-slate-100 font-bold text-slate-900 border-t-2 border-slate-300">
                <td class="py-3 px-4">區間總計</td>`;
            recorders.forEach(rec => {
                bodyHTML += `<td class="py-3 px-4 text-center text-slate-900">${userTotals[rec] || 0}</td>`;
            });
            bodyHTML += `<td class="py-3 px-4 text-center text-blue-700 text-base">${grandTotal}</td></tr>`;

            body.innerHTML = bodyHTML;
        }
    </script>
</body>
</html>
